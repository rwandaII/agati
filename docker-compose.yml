# Local postgres for development. Nothing here is secret, it only listens on
# localhost and holds seed data.
#
#   docker compose up -d     start
#   docker compose down      stop, keep data
#   docker compose down -v   stop and wipe
services:
  db:
    image: postgres:17-alpine
    container_name: agati-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agati
      POSTGRES_PASSWORD: agati
      POSTGRES_DB: agati
    # 5434 because 5432 and 5433 are taken on my machine by other projects.
    ports:
      - '5434:5432'
    volumes:
      - agati-pgdata:/var/lib/postgresql/data
    # so `npm run db:setup` right after `up -d` doesn't race the first boot
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agati -d agati']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  agati-pgdata:
